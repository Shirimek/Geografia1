<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMistrz | Kurs Geografii Rozszerzonej</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --locked: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--locked);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-container {
            width: 200px;
            height: 10px;
            background: var(--locked);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        #progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .lesson-list { display: grid; gap: 15px; }

        .lesson-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .lesson-card:hover:not(.locked) {
            transform: translateX(10px);
            background: #2d3a4f;
            border-color: var(--accent);
        }

        .lesson-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .lesson-icon {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: var(--accent);
            margin-right: 20px;
        }

        .lesson-info { flex-grow: 1; }
        .lesson-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .lesson-info span { font-size: 0.8rem; color: var(--text-muted); }

        .status-icon { font-size: 1.2rem; margin-left: 15px; }

        #lesson-view { display: none; }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .content-body {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .content-body h2 { margin-bottom: 20px; color: var(--accent); border-bottom: 2px solid var(--locked); padding-bottom: 10px; }
        .content-body p { margin-bottom: 15px; text-align: justify; }

        .quiz-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
        }

        .question-box { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--locked); }
        .option-label {
            display: block;
            background: #2d3a4f;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label:hover { background: #3e4e66; }
        .correct { background: var(--success) !important; color: white; }
        .wrong { background: var(--error) !important; color: white; }

        #check-btn {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
        }

        #result-msg {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>GeoMistrz <i class="fas fa-globe-europe"></i></h1>

<script>
    const lessonsData = [
        {
            id: 1,
            title: "Ziemia jako planeta",
            date: "Rozdział 1.1",
            icon: "fa-earth-americas",
            content: `
                <h2>Kształt i wymiary Ziemi</h2>
                <p>Ziemia nie jest idealną kulą. Przez wieki poglądy na jej kształt ewoluowały. Dziś wiemy, że Ziemia jest <strong>geoidą</strong> – bryłą, której powierzchnia w każdym miejscu jest prostopadła do pionu (kierunku siły ciężkości). W uproszczeniu kartograficznym przyjmuje się model elipsoidy obrotowej.</p>
                <p>Promień równikowy Ziemi wynosi około 6378 km, natomiast promień biegunowy jest o ok. 21 km krótszy. Ta różnica wynika z siły odśrodkowej powstałej podczas ruchu obrotowego planety wokół własnej osi. Powierzchnia Ziemi to ok. 510 mln km², z czego ponad 70% zajmują oceany.</p>
                <h3>Układ Słoneczny</h3>
                <p>Ziemia jest trzecią planetą od Słońca w Układzie Słonecznym. Należy do grupy planet typu ziemskiego (skalistych), charakteryzujących się dużą gęstością i stałą skorupą. Jej unikalną cechą jest obecność wody w trzech stanach skupienia oraz atmosfera bogata w tlen, co umożliwiło rozwój życia. Magnetosfera Ziemi chroni nas przed szkodliwym promieniowaniem kosmicznym i wiatrem słonecznym.</p>
                <p>Kluczowym elementem geografii matematycznej jest siatka geograficzna – układ południków i równoleżników wyznaczony na modelu Ziemi, który pozwala na precyzyjne określenie współrzędnych dowolnego punktu na globie.</p>
            `,
            questions: [
                { q: "Jak nazywa się rzeczywisty kształt Ziemi?", options: ["Kula", "Geoida", "Elipsa", "Stożek"], correct: 1 },
                { q: "Promień równikowy jest dłuższy od biegunowego.", options: ["Prawda", "Fałsz"], correct: 0 },
                { q: "Ile wynosi powierzchnia Ziemi?", options: ["150 mln km²", "300 mln km²", "510 mln km²", "1 mld km²"], correct: 2 },
                { q: "Ziemia jest czwartą planetą od Słońca.", options: ["Prawda", "Fałsz"], correct: 1 },
                { q: "Co chroni Ziemię przed wiatrem słonecznym?", options: ["Księżyc", "Magnetosfera", "Ozon", "Chmury"], correct: 1 }
            ]
        },
        {
            id: 2,
            title: "Ruchy Ziemi i ich następstwa",
            date: "Rozdział 1.2",
            icon: "fa-sync",
            content: `
                <h2>Ruch obrotowy i obiegowy</h2>
                <p>Ziemia wykonuje dwa główne rodzaje ruchów: obrotowy (wokół własnej osi) oraz obiegowy (wokół Słońca). Ruch obrotowy odbywa się z zachodu na wschód i trwa 23 godziny 56 minut i 4 sekundy (doba gwiazdowa). Następstwem tego ruchu jest przede wszystkim dobowa zmiana dnia i nocy.</p>
                <p>Ruch obiegowy odbywa się po orbicie o kształcie elipsy, a pełne okrążenie trwa 365 dni, 5 godzin, 48 minut i 46 sekund. Ponieważ oś ziemska jest nachylona do płaszczyzny ekliptyki pod kątem ok. 66°33', skutkuje to cykliczną zmianą oświetlenia różnych fragmentów Ziemi w ciągu roku.</p>
                <h3>Następstwa ruchów</h3>
                <p>Głównym skutkiem ruchu obiegowego jest występowanie astronomicznych pór roku oraz zmiana długości dnia i nocy w zależności od szerokości geograficznej. Ruch obrotowy natomiast powoduje powstawanie siły Coriolisa, która odchyla kierunek poruszania się ciał (np. wiatrów i prądów morskich) – na półkuli północnej w prawo, a na południowej w lewo.</p>
                <p>Warto pamiętać o dniach przesileń i równonocy, które wyznaczają początki astronomicznych pór roku. Na przykład 22 czerwca Słońce góruje w zenicie nad Zwrotnikiem Raka.</p>
            `,
            questions: [
                { q: "W którą stronę obraca się Ziemia?", options: ["Ze wschodu na zachód", "Z zachodu na wschód"], correct: 1 },
                { q: "Siła Coriolisa odchyla wiatry na półkuli północnej w:", options: ["Lewo", "Prawo", "W ogóle nie odchyla", "W dół"], correct: 1 },
                { q: "Ile trwa pełny obieg Ziemi wokół Słońca?", options: ["24h", "365 dni", "365 dni i ok. 6h", "30 dni"], correct: 2 },
                { q: "Pory roku wynikają z nachylenia osi Ziemi.", options: ["Prawda", "Fałsz"], correct: 0 },
                { q: "Nad jakim równoleżnikiem góruje słońce 21 marca?", options: ["Równik", "Zwrotnik Raka", "Zwrotnik Koziorożca", "Biegun"], correct: 0 }
            ]
        },
        {
            id: 3,
            title: "Współrzędne geograficzne",
            date: "Rozdział 1.3",
            icon: "fa-map-location-dot",
            content: `
                <h2>Szerokość i długość geograficzna</h2>
                <p>Współrzędne geograficzne to podstawowe narzędzie nawigacji. Dzielą się na szerokość (φ) oraz długość (λ) geograficzną.</p>
                <p><strong>Szerokość geograficzna</strong> to kąt między płaszczyzną równika a promieniem ziemskim przechodzącym przez dany punkt. Przyjmuje wartości od 0° (równik) do 90° (bieguny) N (północna) lub S (południowa).</p>
                <p><strong>Długość geograficzna</strong> to kąt dwuścienny między półpłaszczyzną południka zerowego (Greenwich) a półpłaszczyzną południka przechodzącego przez dany punkt. Przyjmuje wartości od 0° do 180° E (wschodnia) lub W (zachodnia).</p>
                <h3>Praktyczne zastosowanie</h3>
                <p>Znajomość współrzędnych pozwala wyznaczać czas słoneczny oraz strefy czasowe. Jeden stopień długości geograficznej odpowiada 4 minutom czasu słonecznego. Dzięki temu świat podzielono na 24 strefy czasowe, każda po 15 stopni długości geograficznej.</p>
            `,
            questions: [
                { q: "Jaka jest maksymalna wartość szerokości geograficznej?", options: ["90°", "180°", "360°", "45°"], correct: 0 },
                { q: "Południk 0° przechodzi przez dzielnicę Londynu:", options: ["Soho", "Greenwich", "Chelsea", "Wimbledon"], correct: 1 },
                { q: "1 stopień długości to ile minut czasu?", options: ["1 min", "4 min", "15 min", "60 min"], correct: 1 },
                { q: "Równoleżniki są różnej długości.", options: ["Prawda", "Fałsz"], correct: 0 },
                { q: "Długość geograficzna może być północna.", options: ["Prawda", "Fałsz"], correct: 1 }
            ]
        },
        {
            id: 4,
            title: "Budowa wnętrza Ziemi",
            date: "Rozdział 2.1",
            icon: "fa-earth-americas",
            content: `
                <h2>Warstwy Ziemi</h2>
                <p>Wnętrze naszej planety składa się z koncentrycznych warstw różniących się właściwościami fizycznymi i składem chemicznym. Podział ten znamy głównie dzięki badaniom fal sejsmicznych.</p>
                <p>1. <strong>Skorupa ziemska</strong>: Najbardziej zewnętrzna, sztywna warstwa. Dzieli się na kontynentalną (grubszą) i oceaniczną (cieńszą, ale gęstszą).<br>
                2. <strong>Płaszcz Ziemi</strong>: Stanowi ok. 80% objętości planety. Dzieli się na płaszcz górny (z plastyczną astenosferą) i dolny.<br>
                3. <strong>Jądro Ziemi</strong>: Składa się głównie z żelaza i niklu. Jądro zewnętrzne jest płynne, a wewnętrzne stałe (mimo ogromnej temperatury, ze względu na kolosalne ciśnienie).</p>
                <p>Granice między warstwami nazywamy nieciągłościami (np. Moho między skorupą a płaszczem).</p>
            `,
            questions: [
                { q: "Która warstwa jest płynna?", options: ["Skorupa", "Płaszcz górny", "Jądro zewnętrzne", "Jądro wewnętrzne"], correct: 2 },
                { q: "Główny składnik jądra to:", options: ["Krzem i glin", "Żelazo i nikiel", "Wapń", "Magnez"], correct: 1 },
                { q: "Nieciągłość Moho oddziela skorupę od płaszcza.", options: ["Prawda", "Fałsz"], correct: 0 },
                { q: "Skorupa oceaniczna jest grubsza od kontynentalnej.", options: ["Prawda", "Fałsz"], correct: 1 }
            ]
        },
        {
            id: 5,
            title: "Skały i minerały",
            date: "Rozdział 2.2",
            icon: "fa-gem",
            content: `
                <h2>Skarby skorupy ziemskiej</h2>
                <p>Wszystko, co widzimy pod stopami – od monumentalnych Tatr po piasek na plaży – składa się z minerałów i skał. <strong>Minerał</strong> to pierwiastek lub związek chemiczny powstały w sposób naturalny, posiadający określoną strukturę krystaliczną (np. diament czy kwarc). <strong>Skała</strong> natomiast to naturalne skupisko jednego lub wielu minerałów.</p>
                <p>Skały dzielimy na trzy główne grupy ze względu na ich genezę. <strong>Skały magmowe</strong> powstają w wyniku krzepnięcia magmy (głębinowe, np. granit o strukturze jawno-krystalicznej) lub lawy (wylewne, np. bazalt o strukturze skrytokrystalicznej). <strong>Skały osadowe</strong> tworzą się na powierzchni Ziemi poprzez gromadzenie się materiału. Mogą być okruchowe (piaskowiec), pochodzenia organicznego (węgiel, wapienie) lub chemicznego (sól kamienna). Trzecią grupą są <strong>skały metamorficzne</strong>, które powstają, gdy istniejące już skały zostają poddane ogromnemu ciśnieniu i temperaturze w głębi Ziemi, co zmienia ich strukturę (np. marmur powstały z wapienia).</p>
                <p>Ciekawostką jest obieg materii w przyrodzie: każda skała może stać się inną w procesie cyklu skalnego. Co więcej, twardość minerałów określamy za pomocą 10-stopniowej skali Mohsa, gdzie 1 to miękki talk, a 10 to najtwardszy diament.</p>
            `,
            questions: [
                { q: "Która skała jest przykładem skały magmowej głębinowej?", options: ["Bazalt", "Granit", "Wapień", "Marmur"], correct: 1 },
                { q: "Z czego powstaje marmur w procesie metamorfizmu?", options: ["Z piaskowca", "Z granitu", "Z wapienia", "Z gliny"], correct: 2 },
                { q: "Który minerał otwiera skalę Mohsa (stopień 1)?", options: ["Gips", "Kwarc", "Talk", "Diament"], correct: 2 },
                { q: "Skały osadowe okruchowe powstają z:", options: ["Zastygłej lawy", "Szczątków roślin", "Rozdrobnionych fragmentów starszych skał", "Wysokiego ciśnienia"], correct: 2 },
                { q: "Sól kamienna to skała osadowa pochodzenia:", options: ["Organicznego", "Chemicznego", "Okruchowego", "Wulkanicznego"], correct: 1 },
                { q: "Struktura skrytokrystaliczna jest charakterystyczna dla:", options: ["Bazaltu", "Granitu", "Gnejsu", "Węgla"], correct: 0 },
                { q: "Czy każda skała może ulec przeobrażeniu (metamorfizmowi)?", options: ["Tak", "Nie"], correct: 0 }
            ]
        },
        {
            id: 6,
            title: "Procesy geologiczne",
            date: "Rozdział 2.3",
            icon: "fa-mountain-sun",
            content: `
                <h2>Siły rzeźbiące naszą planetę</h2>
                <p>Powierzchnia Ziemi jest polem nieustannej walki dwóch potężnych sił: <strong>procesów endogenicznych</strong> (wewnętrznych) oraz <strong>egzogenicznych</strong> (zewnętrznych). Procesy wewnętrzne czerpią energię z ciepła wnętrza Ziemi. To one odpowiadają za ruchy płyt litosfery, powstawanie gór (orogenezy), trzęsienia ziemi oraz wulkanizm. Dzięki nim powstają wielkie formy ukształtowania terenu, jak łańcuchy Himalajów czy rowy oceaniczne.</p>
                <p>Z kolei procesy zewnętrzne działają destrukcyjnie i wyrównująco. Kluczowym elementem jest <strong>wietrzenie</strong> – proces rozpadu skał pod wpływem czynników fizycznych (zmiany temperatury, mróz), chemicznych (woda, tlen) lub biologicznych. Kolejnym etapem jest <strong>erozja</strong> (niszczenie przez wodę, wiatr czy lodowce), transport materiału i jego <strong>akumulacja</strong> (osadzanie) w obniżeniach terenu.</p>
                <p>Niezwykle widowiskowe są procesy rzeźbotwórcze rzek, które w górnym biegu wycinają głębokie doliny w kształcie litery V, a w dolnym tworzą delty. Pustynie z kolei są modelowane przez eoliczne (wiatrowe) procesy korazji i deflacji. Zrozumienie tych mechanizmów pozwala nam przewidywać zagrożenia, takie jak osuwiska czy powodzie.</p>
            `,
            questions: [
                { q: "Który proces zaliczamy do endogenicznych?", options: ["Wietrzenie", "Wulkanizm", "Erozja rzeczna", "Deflacja"], correct: 1 },
                { q: "Dolina w kształcie litery U jest wynikiem działania:", options: ["Rzeki", "Wiatru", "Lodowca górskiego", "Fali morskiej"], correct: 2 },
                { q: "Rozpad skały pod wpływem zamarzającej wody w szczelinach to:", options: ["Wietrzenie mrozowe", "Korozja", "Metamorfizm", "Akumulacja"], correct: 0 },
                { q: "Orogeneza to proces:", options: ["Niszczenia skał", "Powstawania gór", "Wybuchu wulkanu", "Osadzania piasku"], correct: 1 },
                { q: "Wywiwanie drobnego materiału przez wiatr to:", options: ["Korazja", "Deflacja", "Abrazja", "Eksfoliacja"], correct: 1 },
                { q: "Gdzie energia procesów egzogenicznych ma swoje główne źródło?", options: ["W jądrze Ziemi", "W Słońcu", "W Księżycu", "W polu magnetycznym"], correct: 1 },
                { q: "Proces osadzania materiału skalnego to:", options: ["Erozja", "Denudacja", "Akumulacja", "Transport"], correct: 2 }
            ]
        },
        {
            id: 7,
            title: "Atmosfera",
            date: "Rozdział 3.1",
            icon: "fa-cloud",
            content: `
                <h2>Powietrzna tarcza Ziemi</h2>
                <p>Atmosfera to gazowa powłoka Ziemi, bez której życie nie mogłoby istnieć. Składa się głównie z <strong>azotu (78%)</strong> oraz <strong>tlenu (21%)</strong>. Pozostały 1% to argon, dwutlenek węgla i inne gazy śladowe. Atmosfera chroni nas przed promieniowaniem UV, zapewnia odpowiednią temperaturę dzięki efektowi cieplarnianemu i dostarcza gazów niezbędnych do oddychania.</p>
                <p>Budowa atmosfery jest warstwowa. Najniższa i najważniejsza dla nas to <strong>troposfera</strong> – tu zachodzą wszystkie zjawiska pogodowe, a temperatura spada wraz z wysokością (średnio o 0,6°C na 100 metrów). Powyżej znajduje się <strong>stratosfera</strong>, w której mieści się warstwa ozonowa (ozonosfera), pochłaniająca zabójcze promieniowanie słoneczne. Kolejne to mezosfera, termosfera i egzosfera, która płynnie przechodzi w przestrzeń kosmiczną.</p>
                <p>Ciśnienie atmosferyczne to ciężar słupa powietrza naciskający na powierzchnię Ziemi. Jego standardowa wartość na poziomie morza to 1013,25 hPa. Różnice ciśnień wywołują poziomy ruch powietrza, czyli <strong>wiatr</strong>, który zawsze wieje z wyżu do niżu barycznego.</p>
            `,
            questions: [
                { q: "Który gaz dominuje w składzie atmosfery?", options: ["Tlen", "Azot", "Argon", "CO2"], correct: 1 },
                { q: "W której warstwie zachodzą zjawiska pogodowe?", options: ["Stratosfera", "Mezosfera", "Troposfera", "Termosfera"], correct: 2 },
                { q: "Gdzie znajduje się warstwa ozonowa?", options: ["W troposferze", "W stratosferze", "W egzosferze", "W jądrze"], correct: 1 },
                { q: "O ile stopni średnio spada temperatura co 100m w troposferze?", options: ["1°C", "0,6°C", "2°C", "0,1°C"], correct: 1 },
                { q: "Wiatr zawsze wieje z:", options: ["Niżu do wyżu", "Wyżu do niżu", "Północy na południe", "Wschodu na zachód"], correct: 1 },
                { q: "Standardowe ciśnienie na poziomie morza wynosi ok.:", options: ["1000 hPa", "1013 hPa", "980 hPa", "1050 hPa"], correct: 1 },
                { q: "Zjawisko zorzy polarnej występuje głównie w:", options: ["Troposferze", "Termosferze", "Stratosferze", "Mezosferze"], correct: 1 }
            ]
        },
        {
            id: 8,
            title: "Klimat",
            date: "Rozdział 3.2",
            icon: "fa-temperature-high",
            content: `
                <h2>Pogoda a klimat</h2>
                <p>Często mylimy te dwa pojęcia. <strong>Pogoda</strong> to chwilowy stan atmosfery w danym miejscu, natomiast <strong>klimat</strong> to wieloletni (minimum 30-letni) reżim pogodowy ustalony na podstawie systematycznych obserwacji. Na klimat wpływa wiele czynników: szerokość geograficzna (kąt padania promieni słonecznych), rozmieszczenie lądów i oceanów, prądy morskie, wysokość nade poziom morza oraz rzeźba terenu.</p>
                <p>Najpopularniejsza klasyfikacja klimatyczna dzieli Ziemię na strefy: równikową, zwrotnikową, podzwrotnikową, umiarkowaną i okołobiegunową. W strefie równikowej panują wysokie temperatury i codzienne opady (deszcze zenitalne). W strefach zwrotnikowych często występują pustynie ze względu na zstępujące prądy powietrza. Klimat umiarkowany, w którym leży Polska, charakteryzuje się wyraźną sezonowością.</p>
                <p>Ogromny wpływ na klimat mają <strong>prądy morskie</strong>. Ciepłe prądy (np. Prąd Północnoatlantycki) ogrzewają i nawilżają wybrzeża, natomiast prądy zimne (np. Prąd Benguelski) przyczyniają się do powstawania pustyń mglistych na wybrzeżach. Obecnie stoimy przed wyzwaniem globalnego ocieplenia, które zmienia granice tych stref i powoduje ekstremalne zjawiska pogodowe.</p>
            `,
            questions: [
                { q: "Jaki jest minimalny okres obserwacji do określenia klimatu?", options: ["1 rok", "10 lat", "30 lat", "100 lat"], correct: 2 },
                { q: "Deszcze zenitalne są charakterystyczne dla strefy:", options: ["Zwrotnikowej", "Równikowej", "Umiarkowanej", "Okołobiegunowej"], correct: 1 },
                { q: "Ciepły prąd morski płynący obok Europy to:", options: ["Prąd Labradorski", "Prąd Północnoatlantycki", "Prąd Peruwiański", "Prąd Benguelski"], correct: 1 },
                { q: "Polska leży w strefie klimatów:", options: ["Podzwrotnikowych", "Zwrotnikowych", "Umiarkowanych", "Okołobiegunowych"], correct: 2 },
                { q: "Głównym czynnikiem klimatotwórczym decydującym o strefowości jest:", options: ["Wysokość n.p.m.", "Szerokość geograficzna", "Prądy morskie", "Roślinność"], correct: 1 },
                { q: "Klimat kontynentalny w porównaniu do morskiego cechuje się:", options: ["Małymi amplitudami temp.", "Dużymi amplitudami temp.", "Brakiem zimy", "Dużymi opadami"], correct: 1 },
                { q: "Monsun to wiatr:", options: ["Stały", "Lokalny", "Sezonowy", "Pustynny"], correct: 2 }
            ]
        }
    ];

    let currentLesson = null;
    let unlockedLessons = JSON.parse(localStorage.getItem('geo_unlocked')) || [1];

    function init() {
        renderLessonList();
        updateProgress();
    }

    function renderLessonList() {
        const listContainer = document.getElementById('list-view');
        listContainer.innerHTML = '';

        lessonsData.forEach((lesson) => {
            const isLocked = !unlockedLessons.includes(lesson.id);
            const isCompleted = unlockedLessons.includes(lesson.id + 1);
            
            const card = document.createElement('div');
            card.className = `lesson-card ${isLocked ? 'locked' : ''} fade-in`;
            card.onclick = () => !isLocked && openLesson(lesson.id);

            card.innerHTML = `
                <div class="lesson-icon">
                    <i class="fas ${isLocked ? 'fa-lock' : lesson.icon}"></i>
                </div>
                <div class="lesson-info">
                    <span>${lesson.date}</span>
                    <h3>Lekcja ${lesson.id}: ${lesson.title}</h3>
                </div>
                <div class="status-icon">
                    ${isCompleted ? '<i class="fas fa-check-circle" style="color:var(--success)"></i>' : 
                      (isLocked ? '' : '<i class="fas fa-chevron-right"></i>')}
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function openLesson(id) {
        currentLesson = lessonsData.find(l => l.id === id);
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('lesson-view').style.display = 'block';
        document.getElementById('lesson-content').innerHTML = currentLesson.content;
        
        const quizContainer = document.getElementById('quiz-container');
        quizContainer.innerHTML = '';
        
        currentLesson.questions.forEach((q, qIdx) => {
            const qBox = document.createElement('div');
            qBox.className = 'question-box';
            qBox.innerHTML = `<p><strong>Q${qIdx+1}:</strong> ${q.q}</p>
                <div class="options">
                    ${q.options.map((opt, oIdx) => `
                        <label class="option-label">
                            <input type="radio" name="q${qIdx}" value="${oIdx}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>`;
            quizContainer.appendChild(qBox);
        });

        document.getElementById('check-btn').style.display = 'block';
        document.getElementById('result-msg').style.display = 'none';
        window.scrollTo(0, 0);
    }

    function showListView() {
        document.getElementById('list-view').style.display = 'grid';
        document.getElementById('lesson-view').style.display = 'none';
        renderLessonList();
    }

    function checkQuiz() {
        const questions = currentLesson.questions;
        let score = 0;
        
        questions.forEach((q, qIdx) => {
            const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
            const inputs = document.querySelectorAll(`input[name="q${qIdx}"]`);
            
            inputs.forEach(input => {
                const label = input.parentElement;
                const val = parseInt(input.value);
                
                if(val === q.correct) label.classList.add('correct');
                if(selected && parseInt(selected.value) === val && val !== q.correct) {
                    label.classList.add('wrong');
                }
                input.disabled = true;
            });

            if(selected && parseInt(selected.value) === q.correct) score++;
        });

        const percent = (score / questions.length) * 100;
        const msg = document.getElementById('result-msg');
        msg.style.display = 'block';
        msg.scrollIntoView({ behavior: 'smooth' });

        if(percent >= 80) {
            msg.innerHTML = `<span style="color:var(--success)">Zaliczone! ✅ Wynik: ${score}/${questions.length}</span>`;
            if(!unlockedLessons.includes(currentLesson.id + 1) && currentLesson.id < lessonsData.length) {
                unlockedLessons.push(currentLesson.id + 1);
                localStorage.setItem('geo_unlocked', JSON.stringify(unlockedLessons));
            }
        } else {
            msg.innerHTML = `<span style="color:var(--error)">Spróbuj ponownie ❌ Wynik: ${score}/${questions.length} (wymagane 80%)</span>`;
        }

        document.getElementById('check-btn').style.display = 'none';
        updateProgress();
    }

    function updateProgress() {
        const total = lessonsData.length;
        const completed = unlockedLessons.length - 1;
        const percent = Math.round((completed / total) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').innerText = `Postęp: ${percent}%`;
    }

    init();
</script>
</body>
</html>
